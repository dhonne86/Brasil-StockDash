services:
  - type: web
    name: aplicacoes-para-web
    runtime: static
    buildCommand: echo "Static site ready"
    staticPublishPath: "./aplicações para web"
    autoDeployTrigger: commit
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
